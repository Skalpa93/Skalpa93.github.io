<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#070b24">
  <meta name="description" content="Neon Maze, un jeu de labyrinthe arcade installable sur iPhone.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>Neon Maze</title>
  <style>
    :root{color-scheme:dark;--bg:#070b24;--panel:#101738;--cyan:#22d3ee;--yellow:#ffd83d;--pink:#ff4f9a;--muted:#9aa5d1}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#17225b 0,#070b24 52%);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;overflow-x:hidden}
    body{display:flex;justify-content:center;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
    main{width:min(100%,520px);padding:16px 0 24px}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    .brand{display:flex;align-items:center;gap:10px}.brand-mark{width:34px;height:34px;border-radius:50%;background:conic-gradient(from 35deg,#ffd83d 0 300deg,transparent 300deg);box-shadow:0 0 20px #ffd83d66}.brand h1{font-size:20px;letter-spacing:.12em;margin:0;display:flex;align-items:center;gap:7px}.version{font-size:10px;letter-spacing:.08em;color:#07122e;background:var(--cyan);border-radius:5px;padding:3px 5px;box-shadow:0 0 10px #22d3ee66}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.18em;margin-top:2px}
    .actions{display:flex;gap:8px}.icon-btn{border:1px solid #3a477e;background:#121b44;color:#fff;border-radius:12px;width:42px;height:38px;font-size:17px;cursor:pointer}.icon-btn:active{transform:scale(.94)}.icon-btn.active{border-color:var(--cyan);color:var(--cyan);background:#1b2860}
    .hud{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}.stat{background:#101738cc;border:1px solid #263361;border-radius:13px;padding:8px 10px}.stat label{display:block;color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase}.stat strong{display:block;font-size:18px;margin-top:2px}
    .game-shell{position:relative;border-radius:20px;padding:9px;background:linear-gradient(145deg,#1f2d6a,#0b1032);box-shadow:0 20px 55px #0009,inset 0 0 0 1px #4758a066}
    canvas{display:block;width:100%;height:auto;aspect-ratio:21/23;background:#05081b;border-radius:13px;image-rendering:pixelated;touch-action:none}
    .overlay{position:absolute;inset:9px;display:flex;align-items:center;justify-content:center;background:#05081bdd;border-radius:13px;text-align:center;padding:24px}.overlay.hidden{display:none}.card{max-width:300px}.card h2{margin:0 0 8px;font-size:28px;letter-spacing:.05em}.card p{margin:0 0 18px;color:#c3caed;line-height:1.45}.primary{border:0;background:linear-gradient(135deg,#ffd83d,#ff9d2e);color:#10142e;font-weight:800;border-radius:12px;padding:13px 22px;font-size:16px;cursor:pointer;box-shadow:0 5px 16px #ffb52e55}.primary:active{transform:translateY(1px)}
    .touch-controls{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,58px);justify-content:center;gap:7px;margin:15px auto 6px}.touch-controls button{border:1px solid #3a477e;background:#121b44;color:#fff;border-radius:16px;font-size:25px;box-shadow:0 5px 0 #080c24;cursor:pointer;touch-action:manipulation}.touch-controls button:active{transform:translateY(3px);box-shadow:0 2px 0 #080c24;background:#1b2860}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}
    .hint{text-align:center;color:#7f8ab7;font-size:12px;margin:8px 0 0}.kbd{display:inline-block;border:1px solid #44528b;border-bottom-width:2px;border-radius:5px;padding:0 4px;color:#b7c1e9;font-size:11px}
    @media (min-width:600px){main{padding-top:28px}.touch-controls{display:none}}
  </style>
</head>
<body>
<main>
  <header>
    <div class="brand"><div class="brand-mark" aria-hidden="true"></div><div><h1>NEON MAZE <span class="version">V9</span></h1><small>ARCADE EDITION</small></div></div>
    <div class="actions"><button class="icon-btn" id="pauseBtn" aria-label="Pause">Ⅱ</button><button class="icon-btn" id="soundBtn" aria-label="Son">🔊</button><button class="icon-btn" id="tiltBtn" aria-label="Activer l’inclinaison">⌁</button></div>
  </header>
  <section class="hud" aria-label="Score"><div class="stat"><label>Score</label><strong id="score">00000</strong></div><div class="stat"><label>Record</label><strong id="highScore">00000</strong></div><div class="stat"><label>Vies</label><strong id="lives">♥♥♥</strong></div></section>
  <section class="game-shell">
    <canvas id="game" width="420" height="460" aria-label="Jeu de labyrinthe"></canvas>
    <div class="overlay" id="overlay"><div class="card"><h2 id="overlayTitle">NEON MAZE</h2><p id="overlayText">Mange tous les points, évite les chasseurs et utilise les bonus pour retourner la situation.</p><button class="primary" id="startBtn">JOUER</button></div></div>
  </section>
  <div class="touch-controls" aria-label="Commandes tactiles"><button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="down" data-dir="down">▼</button><button class="right" data-dir="right">▶</button></div>
  <p class="hint" id="hint">Active ⌁ puis incline ton iPhone pour guider l’avatar.</p>
</main>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score'), highScoreEl = document.getElementById('highScore'), livesEl = document.getElementById('lives');
  const overlay = document.getElementById('overlay'), overlayTitle = document.getElementById('overlayTitle'), overlayText = document.getElementById('overlayText'), startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn'), soundBtn = document.getElementById('soundBtn'), tiltBtn = document.getElementById('tiltBtn'), hint = document.getElementById('hint'), touchControls = document.querySelector('.touch-controls');
  const mapTemplate = [
    '#####################',' #...................#'.replace(/^ /,''),' #.###.#####.#####.###'.replace(/^ /,''),' #o###.#####.#####.##o'.replace(/^ /,''),' #...................#'.replace(/^ /,''),' #.###.#.#######.#.###'.replace(/^ /,''),' #.....#...###...#...#'.replace(/^ /,''),' #####.### ###.###.####'.replace(/^ /,''),'     .### ###.###.     ','#####.### ###.###.#####','    ..    ###    ..    ','#### .###     ###. ####','    .### ### ###.    ','####.### ### ###.####','    .    ###    .    ','####.### ### ###.####',' #...................#'.replace(/^ /,''),' #.###.#####.#####.###'.replace(/^ /,''),' #o..#...........#..o#'.replace(/^ /,''),' ###.#.### ### ###.#.###',' #.....#   ###   #.....#',' #.######## ########.#',' #####################'
  ].map(row => row.padEnd(21,'#').slice(0,21));
  const W = 21, H = 23, TILE = canvas.width / W;
  const dirs = {left:{x:-1,y:0},right:{x:1,y:0},up:{x:0,y:-1},down:{x:0,y:1},none:{x:0,y:0}};
  const opposite = {left:'right',right:'left',up:'down',down:'up',none:'none'};
  const ghostColors = ['#ff4f9a','#22d3ee','#ff8d3d','#b276ff'];
  let grid, player, ghosts, score=0, highScore=Number(localStorage.getItem('neonMazeHighScore')||0), lives=3, running=false, paused=false, last=0, raf, soundOn=true, frightenedUntil=0, dotsLeft=0, level=1, audioCtx, heldInput=null, tiltEnabled=false, tiltDirection='none', tiltBaseline=null, orientationSeen=false;
  highScoreEl.textContent = fmt(highScore);
  function fmt(n){return String(n).padStart(5,'0')}
  function isWall(x,y){return x<0||y<0||x>=W||y>=H||grid[y][x]==='#'}
  function cloneMap(){return mapTemplate.map(r=>r.split(''))}
  function resetPositions(){
    player={x:12,y:14,dir:'none',next:'none',px:12,py:14,inputHeld:false};
    const starts=[{x:10,y:11},{x:11,y:11},{x:9,y:11},{x:12,y:11}];
    ghosts=ghostColors.map((color,i)=>({x:starts[i].x,y:starts[i].y,px:starts[i].x,py:starts[i].y,dir:i%2?'left':'right',color,homeX:i<2?1:19,homeY:i%2?21:1}));
  }
  function resetLevel(){grid=cloneMap();dotsLeft=grid.flat().filter(c=>c==='.'||c==='o').length;resetPositions();frightenedUntil=0;updateHud()}
  function updateHud(){scoreEl.textContent=fmt(score);highScoreEl.textContent=fmt(highScore);livesEl.textContent='♥'.repeat(lives)+'♡'.repeat(3-lives)}
  function start(){score=0;lives=3;level=1;heldInput=null;resetLevel();running=true;paused=false;hideOverlay();last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);beep(440,.06)}
  function hideOverlay(){overlay.classList.add('hidden')}
  function showOverlay(title,text,button='REJOUER'){overlayTitle.textContent=title;overlayText.textContent=text;startBtn.textContent=button;overlay.classList.remove('hidden')}
  function pause(){if(!running)return;paused=!paused;pauseBtn.textContent=paused?'▶':'Ⅱ';if(!paused){last=performance.now();raf=requestAnimationFrame(loop)}else{showOverlay('PAUSE','Respire un coup. La partie reprendra où tu l’as laissée.','REPRENDRE')}}
  function tileAt(obj){return {x:Math.round(obj.px),y:Math.round(obj.py)}}
  function canMove(x,y){return !isWall(x,y)}
  function setDir(dir){if(!dirs[dir])return;if(!running){start();}player.next=dir;if(player.dir==='none')player.dir=dir}
  function pressDir(dir){if(!dirs[dir])return;if(!running){start();}heldInput=dir;player.inputHeld=true;player.next=dir;if(player.dir==='none')player.dir=dir}
  function releaseDir(dir){if(heldInput!==dir)return;heldInput=null;player.inputHeld=false;player.next='none';player.dir='none';player.px=Math.round(player.px);player.py=Math.round(player.py)}
  function setTiltDirection(dir){if(dir===tiltDirection)return;if(tiltDirection!=='none')releaseDir(tiltDirection);tiltDirection=dir;if(dir!=='none')pressDir(dir)}
  function onOrientation(e){
    if(!tiltEnabled || e.beta===null || e.gamma===null)return;
    if(!orientationSeen){orientationSeen=true;hint.textContent='Capteurs actifs. Incline l’iPhone pour déplacer l’avatar.'}
    if(!tiltBaseline){tiltBaseline={beta:e.beta,gamma:e.gamma};return}
    const beta=e.beta-tiltBaseline.beta, gamma=e.gamma-tiltBaseline.gamma, strength=Math.max(Math.abs(beta),Math.abs(gamma));
    const startThreshold=8, stopThreshold=4;
    let dir=tiltDirection;
    if(strength<stopThreshold){dir='none'}
    else if(tiltDirection==='none' && strength>=startThreshold){dir=Math.abs(gamma)>Math.abs(beta)?(gamma>0?'right':'left'):(beta>0?'down':'up')}
    else if(Math.abs(gamma)>Math.abs(beta) && Math.abs(gamma)>=startThreshold){dir=gamma>0?'right':'left'}
    else if(Math.abs(beta)>=startThreshold){dir=beta>0?'down':'up'}
    setTiltDirection(dir);
  }
  async function toggleTilt(){
    if(tiltEnabled){tiltEnabled=false;tiltBaseline=null;orientationSeen=false;setTiltDirection('none');window.removeEventListener('deviceorientation',onOrientation,true);tiltBtn.classList.remove('active');touchControls.style.display='';hint.textContent='Inclinaison désactivée. Appuie sur ⌁ pour la réactiver.';return}
    if(!('DeviceOrientationEvent' in window)){hint.textContent='Les capteurs d’inclinaison ne sont pas disponibles sur cet appareil.';return}
    try{
      if(typeof DeviceOrientationEvent.requestPermission==='function'){
        const permission=await DeviceOrientationEvent.requestPermission();
        if(permission!=='granted'){hint.textContent='Autorise l’accès aux capteurs pour utiliser l’inclinaison.';return}
      }
      tiltEnabled=true;tiltBaseline=null;orientationSeen=false;window.addEventListener('deviceorientation',onOrientation,true);tiltBtn.classList.add('active');touchControls.style.display='none';hint.textContent='Incline l’iPhone à gauche, à droite, vers l’avant ou vers toi. Remets-le droit pour t’arrêter.';
    }catch(err){hint.textContent='L’accès aux capteurs a été refusé. Vérifie les réglages de Safari.'}
  }
  function movePlayer(dt){
    const activeDir=tiltEnabled && tiltDirection!=='none'?tiltDirection:(player.inputHeld?player.dir:player.dir);
    if(!activeDir || activeDir==='none')return;
    const d=dirs[activeDir], step=5.6*dt, nx=player.px+d.x*step, ny=player.py+d.y*step;
    player.dir=activeDir;player.next=activeDir;
    if(canMove(Math.round(nx),Math.round(ny))){player.px=nx;player.py=ny}
    else{player.px=Math.round(player.px);player.py=Math.round(player.py)}
    if(player.px<0)player.px=W-1;if(player.px>=W)player.px=0;
  }
  function chooseGhostDir(g){
    const frightened=frightenedUntil>performance.now();
    const tx=frightened?10:(level%2?player.px:g.homeX), ty=frightened?11:(level%2?player.py:g.homeY);
    const options=['up','left','down','right'].filter(d=>d!==opposite[g.dir]&&canMove(Math.round(g.px+dirs[d].x),Math.round(g.py+dirs[d].y)));
    if(!options.length){g.dir=opposite[g.dir];return}
    options.sort((a,b)=>{const da=Math.hypot(g.px+dirs[a].x-tx,g.py+dirs[a].y-ty),db=Math.hypot(g.px+dirs[b].x-tx,g.py+dirs[b].y-ty);return (frightened?db-da:da-db)+(Math.random()-.5)*1.2});
    g.dir=options[0];
  }
  function moveGhost(g,dt){
    if(Math.abs(g.px-Math.round(g.px))<.08&&Math.abs(g.py-Math.round(g.py))<.08)chooseGhostDir(g);
    const d=dirs[g.dir]||dirs.none, step=(2.65+(level-1)*.18)*dt, nx=g.px+d.x*step, ny=g.py+d.y*step;
    if(canMove(Math.round(nx),Math.round(ny))){g.px=nx;g.py=ny}else{g.px=Math.round(g.px);g.py=Math.round(g.py);chooseGhostDir(g)}
    if(g.px<0)g.px=W-1;if(g.px>=W)g.px=0;
  }
  function update(dt){
    movePlayer(dt);
    ghosts.forEach(g=>moveGhost(g,dt));
    const p=tileAt(player), cell=grid[p.y]?.[p.x];
    if(cell==='.'||cell==='o'){grid[p.y][p.x]=' ';score+=cell==='o'?50:10;if(cell==='o')frightenedUntil=performance.now()+7000;dotsLeft--;beep(cell==='o'?180:520,.035);if(score>highScore){highScore=score;localStorage.setItem('neonMazeHighScore',highScore)}if(!dotsLeft){level++;score+=500;resetLevel();beep(660,.12)}}
    ghosts.forEach(g=>{if(Math.hypot(g.px-player.px,g.py-player.py)<.58){if(frightenedUntil>performance.now()){score+=200;g.px=10;g.py=11;g.dir='up';beep(100,.1)}else{lives--;beep(80,.3);if(lives<=0){running=false;showOverlay('GAME OVER','Score final : '+fmt(score)+'. Encore une partie ?','REJOUER')}else{resetPositions();paused=true;showOverlay('AÏE !','Il te reste '+lives+' vie'+(lives>1?'s':'')+'.','CONTINUER')}}}});
    updateHud();
  }
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#05081b';ctx.fillRect(0,0,canvas.width,canvas.height);
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=grid[y][x], px=x*TILE,py=y*TILE;if(c==='#'){ctx.fillStyle='#172b73';ctx.fillRect(px+1,py+1,TILE-2,TILE-2);ctx.strokeStyle='#2851c8';ctx.lineWidth=1;ctx.strokeRect(px+2,py+2,TILE-4,TILE-4)}else if(c==='.'||c==='o'){ctx.fillStyle=c==='o'?'#fff':'#dbe6ff';ctx.shadowColor=c==='o'?'#fff':'transparent';ctx.shadowBlur=c==='o'?8:0;ctx.beginPath();ctx.arc(px+TILE/2,py+TILE/2,c==='o'?4:1.6,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}}
    drawPlayer();ghosts.forEach(drawGhost);if(paused&&overlay.classList.contains('hidden')){ctx.fillStyle='#fff';ctx.font='bold 20px system-ui';ctx.textAlign='center';ctx.fillText('PAUSE',canvas.width/2,canvas.height/2)}
  }
  function drawPlayer(){const x=player.px*TILE+TILE/2,y=player.py*TILE+TILE/2,r=TILE*.42, d=dirs[player.dir==='none'?player.next:player.dir]||dirs.right;const angle=Math.atan2(d.y,d.x), mouth=.22+Math.abs(Math.sin(performance.now()/100))*.18;ctx.fillStyle='#ffd83d';ctx.shadowColor='#ffd83d';ctx.shadowBlur=10;ctx.beginPath();ctx.moveTo(x,y);ctx.arc(x,y,r,angle+mouth,angle+Math.PI*2-mouth);ctx.closePath();ctx.fill();ctx.shadowBlur=0}
  function drawGhost(g){const x=g.px*TILE+TILE/2,y=g.py*TILE+TILE/2,r=TILE*.38, frightened=frightenedUntil>performance.now();ctx.fillStyle=frightened?'#4267e8':g.color;ctx.beginPath();ctx.arc(x,y-r*.12,r,Math.PI,0);ctx.lineTo(x+r,y+r*.9);ctx.lineTo(x+r*.5,y+r*.55);ctx.lineTo(x,y+r*.9);ctx.lineTo(x-r*.5,y+r*.55);ctx.lineTo(x-r,y+r*.9);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x-r*.36,y-r*.12,r*.2,0,Math.PI*2);ctx.arc(x+r*.36,y-r*.12,r*.2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#10142e';ctx.beginPath();ctx.arc(x-r*.3,y-r*.1,r*.09,0,Math.PI*2);ctx.arc(x+r*.3,y-r*.1,r*.09,0,Math.PI*2);ctx.fill()}
  function loop(t){if(!running)return;const dt=Math.min((t-last)/1000,.05);last=t;if(!paused)update(dt);draw();raf=requestAnimationFrame(loop)}
  function beep(freq,duration){if(!soundOn)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;o.type='square';g.gain.setValueAtTime(.025,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration)}catch(e){}}
  startBtn.addEventListener('click',()=>{if(running&&paused){paused=false;hideOverlay();pauseBtn.textContent='Ⅱ';last=performance.now();raf=requestAnimationFrame(loop)}else start()});pauseBtn.addEventListener('click',pause);soundBtn.addEventListener('click',()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?'🔊':'🔇'});tiltBtn.addEventListener('click',toggleTilt);
  document.querySelectorAll('[data-dir]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture?.(e.pointerId);pressDir(b.dataset.dir)});b.addEventListener('pointerup',e=>{e.preventDefault();releaseDir(b.dataset.dir)});b.addEventListener('pointercancel',()=>releaseDir(b.dataset.dir));});
  window.addEventListener('keydown',e=>{const m={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down'};if(m[e.key]){e.preventDefault();pressDir(m[e.key])}if(e.key===' '){e.preventDefault();pause()}});
  window.addEventListener('keyup',e=>{const m={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down'};if(m[e.key]){e.preventDefault();releaseDir(m[e.key])}});
  let touchStart=null;canvas.addEventListener('touchstart',e=>{const t=e.changedTouches[0];touchStart={x:t.clientX,y:t.clientY}},{passive:true});canvas.addEventListener('touchend',e=>{if(!touchStart)return;const t=e.changedTouches[0],dx=t.clientX-touchStart.x,dy=t.clientY-touchStart.y;if(Math.max(Math.abs(dx),Math.abs(dy))>18)setDir(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));touchStart=null},{passive:true});
  resetLevel();draw();
  if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script>
</body>
</html>
